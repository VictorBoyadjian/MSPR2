workflows:
  ios-workflow:
    name: iOS — TestFlight (beta externe)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: healthai-app
    integrations:
      app_store_connect: AppStoreConnectKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: healthai-app
      vars:
        XCODE_WORKSPACE: ios/healthaiapp.xcworkspace
        XCODE_SCHEME: healthaiapp
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        # npm install déclenche le hook postinstall → patch-package applique
        # patches/expo-modules-jsi+56.0.9.patch (fix `weak let` Swift 6 / Xcode 26).
        script: npm install --legacy-peer-deps

      - name: Expo prebuild (iOS)
        # Régénère ios/. Le config plugin ./plugins/withSwift5Pods force
        # SWIFT_VERSION=5.0 sur tous les pods (workaround Swift 6 / Xcode 26),
        # et le pod install final s'exécute avec ce réglage.
        script: npx expo prebuild --platform ios --non-interactive

      - name: Set build number
        # Numéro de build unique par run Codemagic → évite le rejet TestFlight
        # "build already exists".
        script: |
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project "ios/healthaiapp.xcodeproj"

      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/$XCODE_SCHEME.xcarchive" \
            archive | xcpretty

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/$XCODE_SCHEME.xcarchive" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath "$CM_BUILD_DIR/build/ipa" | xcpretty

    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Envoie le build sur TestFlight (= "submit to beta preview").
        submit_to_testflight: true
        # Groupe EXTERNE → déclenche la Beta App Review au 1er build d'une version.
        # ⚠️ Vérifie que ce nom correspond EXACTEMENT au groupe dans
        # App Store Connect > TestFlight > Groupes de test externes.
        beta_groups:
          - Gael


  android-workflow:
    name: Android — Google Play Internal
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: healthai-app
    environment:
      android_signing:
        - keystore_reference  # TODO: nom de ton keystore configuré dans Codemagic
      vars:
        PACKAGE_NAME: healthai.app
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Expo prebuild (Android)
        script: npx expo prebuild --platform android --non-interactive

      - name: Set version code
        script: |
          cd android
          # versionCode unique par run pour le track Google Play.
          sed -i.bak "s/versionCode .*/versionCode $BUILD_NUMBER/" app/build.gradle

      - name: Build Android AAB (Release)
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - healthai-app/android/app/build/outputs/**/*.aab
      - healthai-app/android/app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - victor.boyadjian5@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
