global:
  scrape_interval: 30s
  scrape_timeout: 15s

scrape_configs:
  - job_name: "api-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://laravel:80/up"]
        labels:
          service: "API metier (Laravel)"
      - targets: ["http://image-analysis-api:2021/health/"]
        labels:
          service: "Image Analysis API"
      - targets: ["http://ml-engine-api:8000/health"]
        labels:
          service: "ML / Reco API"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
