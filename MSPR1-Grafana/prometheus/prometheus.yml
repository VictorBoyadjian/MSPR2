global:
  scrape_interval: 30s
  scrape_timeout: 15s

scrape_configs:
  - job_name: "api-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://mspr2-api-production.up.railway.app/up"]
        labels:
          service: "API metier (Laravel)"
      - targets: ["https://ollama-api-production-44b6.up.railway.app/health/"]
        labels:
          service: "Image Analysis API"
      - targets: ["https://mlmspr2-production.up.railway.app/health"]
        labels:
          service: "ML / Reco API"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        # Nom du service blackbox sur Railway -> <service>.railway.internal
        replacement: blackbox.railway.internal:9115
