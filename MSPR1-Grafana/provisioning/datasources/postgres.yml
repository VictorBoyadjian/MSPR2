apiVersion: 1

# Datasource provisionnée : la connexion vient des variables d'environnement
# du service Grafana sur Railway. L'uid reprend celui déjà référencé par les
# dashboards seedés (bfihq3r1djhfkb) pour ne rien casser.
datasources:
  - name: grafana-postgresql-datasource
    uid: bfihq3r1djhfkb
    type: grafana-postgresql-datasource
    access: proxy
    url: ${DB_HOST}:${DB_PORT}
    user: ${DB_USERNAME}
    isDefault: true
    editable: false
    jsonData:
      database: ${DB_DATABASE}
      sslmode: ${DB_SSLMODE}
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
    secureJsonData:
      password: ${DB_PASSWORD}
