services:
  postgres:
    build: ../MSPR1-PostgreSQL
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-healthai}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mspr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  laravel:
    build: ../MSPR1-API
    container_name: mspr1-api
    ports:
      - "8080:80"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-healthai}"
      APP_NAME: "${APP_NAME:-Laravel}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:DaQoivSevAIY/t9o6EBpu5A5VIB8xd5DfmJAU8xuVz4=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-en_US}"
      APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-file}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_STACK: "${LOG_STACK:-single}"
      LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL:-null}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-thomas.proxy.rlwy.net}"
      DB_PORT: "${DB_PORT:-14269}"
      DB_DATABASE: "${DB_DATABASE:-healthai}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_SCHEMA_DATA: "${DB_SCHEMA_DATA:-Data}"
      DB_SCHEMA_SYSTEM: "${DB_SCHEMA_SYSTEM:-System}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
      SESSION_PATH: "${SESSION_PATH:-/}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      MEMCACHED_HOST: "${MEMCACHED_HOST:-127.0.0.1}"
      REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
      REDIS_HOST: "${REDIS_HOST:-127.0.0.1}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-null}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-null}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-null}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Laravel}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"
      VITE_APP_NAME: "${VITE_APP_NAME:-Laravel}"
      L5_SWAGGER_GENERATE_ALWAYS: "${L5_SWAGGER_GENERATE_ALWAYS:-true}"
      L5_SWAGGER_BASE_PATH: "${L5_SWAGGER_BASE_PATH:-/api}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - mspr-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    platform: linux/amd64
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-0.0.0.0}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
    networks:
      - mspr-network
    mem_limit: 12g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  image-analysis-api:
    build: ../MSPR2-Image-Analysis-API
    container_name: image-analysis-api
    ports:
      - "2021:2021"
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal}"
      OLLAMA_PORT: "${OLLAMA_PORT:-11434}"
      OLLAMA_MODELS: "${OLLAMA_MODELS:-['llava:7b']}"
      OLLAMA_SELECTED_MODEL: "${OLLAMA_SELECTED_MODEL:-0}"
      LARAVEL_HOST: "${LARAVEL_HOST:-http://laravel}"
      LARAVEL_PORT: "${LARAVEL_PORT:-80}"
      LARAVEL_ME_URL: "${LARAVEL_ME_URL:-/api/me}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-VOqUXTGQR7tPxtMBtD3A2tOHYw2BwGWQé}"
    networks:
      - mspr-network

  ml-engine-api:
    build: ../ML_MSPR2
    container_name: ml-engine-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/healthai}"
      LARAVEL_HOST: "${LARAVEL_HOST:-http://laravel}"
      LARAVEL_PORT: "${LARAVEL_PORT:-80}"
      LARAVEL_ME_URL: "${LARAVEL_ME_URL:-/api/me}"
    networks:
      - mspr-network

  healthai-app:
    build:
      context: ../healthai-app
      args:
        EXPO_PUBLIC_API_URL: "${EXPO_PUBLIC_API_URL:-http://127.0.0.1:8080/api}"
        EXPO_PUBLIC_IMAGE_API_URL: "${EXPO_PUBLIC_IMAGE_API_URL:-http://127.0.0.1:2021}"
        EXPO_PUBLIC_RECO_API_URL: "${EXPO_PUBLIC_RECO_API_URL:-http://127.0.0.1:8000}"
        EXPO_PUBLIC_AI_IMAGE_SOURCE: "${EXPO_PUBLIC_AI_IMAGE_SOURCE:-Ollama}"
    container_name: healthai-app
    ports:
      - "3005:3005"
    depends_on:
      - laravel
      - image-analysis-api
      #- ml-engine-api
    networks:
      - mspr-network
    restart: unless-stopped

  grafana:
    build: ../MSPR1-Grafana
    container_name: mspr1-grafana
    ports:
      - "1506:1506"
    env_file:
      - ../MSPR1-Grafana/.env
    volumes:
      - ../MSPR1-Grafana/data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mspr-network
    restart: unless-stopped

  backup:
    build: ../MSPR3-BACKUP
    container_name: mspr3-backup
    volumes:
      - ../MSPR3-BACKUP/backup:/app/backup
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/healthai"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mspr-network

networks:
  mspr-network:
    driver: bridge

volumes:
  postgres_data:
  app_storage:
