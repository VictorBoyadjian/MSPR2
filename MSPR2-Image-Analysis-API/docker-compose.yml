services:
  image-analysis-api:
    build: ../MSPR2-Image-Analysis-API
    container_name: image-analysis-api
    ports:
      - "2021:2021"
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal}"
      OLLAMA_PORT: "${OLLAMA_PORT:-11434}"
      OLLAMA_MODELS: "${OLLAMA_MODELS:-['llava:7b']}"
      OLLAMA_SELECTED_MODEL: "${OLLAMA_SELECTED_MODEL:-0}"
      LARAVEL_HOST: "${LARAVEL_HOST:-http://laravel}"
      LARAVEL_PORT: "${LARAVEL_PORT:-80}"
      LARAVEL_ME_URL: "${LARAVEL_ME_URL:-/api/me}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-VOqUXTGQR7tPxtMBtD3A2tOHYw2BwGWQé}"